<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">

<title>Nova AI — Smart Chatbot</title>

<style>
:root {
  --bg: #09090f;
  --panel: #11111b;
  --panel2: #171725;
  --border: #29293b;
  --text: #f4f4fa;
  --muted: #9999b0;
  --accent: #8b5cf6;
  --accent2: #6d5dfc;
  --green: #43d9a3;
  --danger: #ff6b81;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% -25%, #30205a 0%, transparent 48%),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible, input:focus-visible,
textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 255px minmax(0, 1fr);
}

/* SIDEBAR */

.sidebar {
  background: rgba(13, 13, 23, .96);
  border-right: 1px solid var(--border);
  padding: 22px 15px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px;
}

.brand-icon {
  height: 40px;
  width: 40px;
  border-radius: 13px;
  background: linear-gradient(135deg, #9c6bff, #6252ef);
  display: grid;
  place-items: center;
  font-size: 22px;
  box-shadow: 0 4px 22px #7858ff35;
}

.brand h2 {
  font-size: 19px;
  margin: 0;
  letter-spacing: -.5px;
}

.brand small {
  color: var(--muted);
  font-size: 11px;
  display: block;
  margin-top: 3px;
}

.new-chat {
  width: 100%;
  border: 1px solid #57468d;
  border-radius: 12px;
  background: #211a38;
  color: white;
  padding: 12px;
  text-align: left;
  transition: .2s;
}

.new-chat:hover {
  background: #30214f;
}

.side-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1.4px;
  padding: 0 9px;
  text-transform: uppercase;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: auto;
}

.history-item {
  border: 0;
  background: transparent;
  color: #c9c9da;
  border-radius: 9px;
  padding: 10px;
  text-align: left;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-item:hover {
  background: var(--panel2);
}

.history-item.active {
  background: #24203b;
  color: white;
}

.sidebar-bottom {
  margin-top: auto;
  display: grid;
  gap: 12px;
}

.api-status {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: #141420;
}

.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}

.dot {
  height: 8px;
  width: 8px;
  border-radius: 50%;
  background: #777;
  flex-shrink: 0;
}

.dot.online {
  background: var(--green);
  box-shadow: 0 0 9px #43d9a366;

.status-hint {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin: 9px 0 0;
}

.settings-btn {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 11px;
  background: transparent;
  color: #ddddec;
  text-align: left;
}

.settings-btn:hover {
  background: var(--panel2);
}

/* MAIN */

.main {
  min-width: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 76px;
  border-bottom: 1px solid var(--border);
  background: #0c0c14d9;

.top-title {

.top-title p {

.top-actions {

.model-select {
  max-width: 250px;

  border: 1px solid var(--border);

.small-btn {
  padding: 10px 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
}

.small-btn:hover {
  border-color: var(--accent);
}

/* CHAT */

.chat-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.chat-content {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 30px 25px 24px;
}

.welcome {
  min-height: 100%;
  padding: 65px 0 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.welcome-icon {
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  font-size: 35px;
  border: 1px solid #594c8b;
  border-radius: 25px;
  background: linear-gradient(135deg, #2d2050, #17162a);
  box-shadow: 0 0 55px #875cff17;
}

.welcome h2 {
  font-size: clamp(25px, 4vw, 37px);
  letter-spacing: -1px;
  margin: 25px 0 9px;
}

.gradient-text {
  background: linear-gradient(90deg, #bd91ff, #8b9dff, #62d9df);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.welcome > p {
  color: var(--muted);
  font-size: 14px;
  max-width: 440px;
  line-height: 1.8;
  margin: 0;
}

.suggestions {
  width: 100%;
  max-width: 620px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 35px;
}

.suggestion {
  text-align: left;
  background: #13131f;
  border: 1px solid var(--border);
  border-radius: 14px;
  color: white;
  padding: 17px;
  transition: .2s;
}

.suggestion:hover {
  border-color: #7961d8;
  background: #1a172a;
  transform: translateY(-2px);
}

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 7px;
}

.suggestion span {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.message {
  display: flex;
  gap: 13px;
  margin: 0 0 28px;
  align-items: flex-start;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 16px;
  background: #25203d;
  border: 1px solid #40365d;
}

.message.user .avatar {
  background: #17372f;
  border-color: #2a5949;
}

.message-body {
  min-width: 0;
  flex: 1;
}

.message-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0 10px;
}

.message-head strong {
  font-size: 13px;
}

.message-head small {
  color: var(--muted);
  font-size: 11px;
}

.message-text {
  color: #dedeea;
  font-size: 14px;
  line-height: 1.85;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message-text pre {
  position: relative;
  white-space: pre;
  overflow: auto;
  padding: 17px;
  border-radius: 11px;
  background: #080810;
  border: 1px solid var(--border);
  font-size: 12px;
}

.message-text code {
  font-family: Consolas, Monaco, monospace;
  font-size: .92em;
  background: #252237;
  padding: 2px 5px;
  border-radius: 5px;
}

.message-text pre code {
  background: none;
  padding: 0;
}

.message-text a {
  color: #b6a4ff;
  text-decoration: underline;
}

.message-tools {
  display: flex;
  gap: 8px;
  margin-top: 11px;
}

.message-tools button {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 9px;
  font-size: 11px;
  color: var(--muted);
  background: transparent;
}

.message-tools button:hover {
  color: white;
  border-color: #6551a0;
}

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 10px 0;
}

.typing span {
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  to { opacity: .25; }
}

/* COMPOSER */

.composer-area {
  padding: 10px 22px 17px;
  background: linear-gradient(transparent, #09090f 22%);
}

.composer {
  max-width: 850px;
  margin: 0 auto;
  border: 1px solid #39354e;
  background: #151520;
  border-radius: 17px;
  padding: 12px 12px 10px 17px;
  box-shadow: 0 8px 40px #00000022;

.composer:focus-within {
  border-color: #7560c5;

#prompt {
  width: 100%;

  line-height: 1.7;
}

#prompt::placeholder {
  color: #77778f;
}

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 9px;
}

.composer-note {
  font-size: 11px;
  color: #85859d;
}

.send-btn {
  border: 0;
  border-radius: 10px;
  padding: 10px 16px;
  background: linear-gradient(135deg, #9365ff, #6857ee);
  color: white;
  font-weight: 650;
  font-size: 12px;
  min-width: 90px;
}

.send-btn:hover {
  filter: brightness(1.12);
}

.send-btn:disabled {
  opacity: .5;

}

.disclaimer {

}

/* SETTINGS MODAL */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000b;

  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 490px;
  max-height: 90vh;
  overflow: auto;
  border: 1px solid #39364e;
  border-radius: 19px;
  background: #12121e;
  box-shadow: 0 25px 90px #0009;
}

.modal-header {
  padding: 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.modal-header h2 {
  font-size: 18px;
  margin: 0;
}

.modal-header p {
  margin: 6px 0 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.close-btn {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 22px;
  align-self: flex-start;
}

.modal-body {
  padding: 22px;
  display: grid;
  gap: 18px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 650;
  margin-bottom: 8px;
}

.field input, .field select {
  width: 100%;
  background: #0b0b14;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
  padding: 12px;
  outline: 0;
}

.field input:focus, .field select:focus {
  border-color: var(--accent);
}

.field-hint {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  margin: 7px 0 0;
}

.key-row {
  display: flex;
  gap: 8px;
}

.key-row input {
  min-width: 0;
  flex: 1;
}

.key-row button {
  border: 1px solid var(--border);
  background: #222233;
  color: white;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 12px;
}

.warning {
  padding: 12px;
  border: 1px solid #664c2b;
  border-radius: 10px;
  background: #2a2116;
  color: #f1c58b;
  font-size: 11px;
  line-height: 1.7;
}

.modal-actions {
  display: flex;
  gap: 9px;
}

.modal-actions button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 650;
}

.primary-btn {
  background: var(--accent);
  color: white;
  border: 0;
}

.secondary-btn {
  background: transparent;
  color: #ddd;
  border: 1px solid var(--border);
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 12px 17px;
  border-radius: 11px;
  background: #262338;
  border: 1px solid #51466f;
  color: white;
  font-size: 12px;
  box-shadow: 0 10px 35px #0007;
  display: none;
  max-width: calc(100% - 30px);
}

.toast.show {
  display: block;
}

.hidden {
  display: none !important;
}

@media (max-width: 800px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .main {
    height: 100dvh;
  }

  .topbar {
    padding: 12px 14px;
    min-height: 68px;

  .top-title h1 {
    font-size: 15px;
  }

  .top-title p {
    font-size: 10px;
  }

  .model-select {
    min-width: 0;
    max-width: 155px;
    width: 155px;
    font-size: 11px;
    padding: 9px 5px;
  }

  .top-actions {
    gap: 6px;
  }

  .small-btn {
    padding: 9px;
    font-size: 11px;
  }

  .chat-content {
    padding: 18px 15px;
  }

  .welcome {
    padding: 45px 0 30px;
  }

  .suggestions {
    gap: 9px;
    margin-top: 25px;
  }

  .suggestion {
    padding: 12px;
  }

  .suggestion strong {
    font-size: 12px;
  }

  .suggestion span {
    font-size: 11px;
  }

  .composer-area {
    padding: 8px 10px 10px;
  }

  .composer-note {
    font-size: 10px;
  }

  .message {
    gap: 9px;
  }

  .avatar {
    width: 30px;
    height: 30px;
  }
}

@media (max-width: 390px) {
  .top-title p {
    display: none;
  }

  .model-select {
    width: 125px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
