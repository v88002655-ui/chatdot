    <meta name="description" content="A modern AI chatbot website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f7fb;
            --chat-bg: #ffffff;
            --header: #ffffff;
            --text: #1f2937;
            --secondary: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --user-msg: #2563eb;
            --bot-msg: #f1f5f9;
            --input-bg: #ffffff;
        }

        body.dark {
            --bg: #0f172a;
            --chat-bg: #111827;
            --header: #111827;
            --text: #f9fafb;
            --secondary: #9ca3af;
            --border: #374151;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --user-msg: #2563eb;
            --bot-msg: #1f2937;
            --input-bg: #1f2937;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 70px;
            background: var(--header);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 21px;
            font-weight: bold;
        }

        .brand-text h1 {
            font-size: 18px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--secondary);
            margin-top: 3px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            border: 1px solid var(--border);
            background: transparent;

            color: var(--text);

            border-radius: 10px;

            cursor: pointer;
            font-size: 18px;

            transition: 0.2s;
        }

        .icon-button:hover {
            background: var(--bot-msg);
        }

        /* CHAT */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px;
        }

        .chat {
            max-width: 900px;
            margin: auto;
        }

        .message {
            display: flex;
            margin-bottom: 22px;
            gap: 12px;
            animation: messageIn 0.25s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
            font-weight: bold;
        }

        .bot .avatar {
            background: #e0e7ff;
            color: #3730a3;
        }

        .user .avatar {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .message-content {
            max-width: 75%;
        }

        .message-name {
            font-size: 11px;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .user .message-name {
            text-align: right;
        }

        .bubble {
            padding: 13px 16px;
            border-radius: 16px;

            line-height: 1.5;
            font-size: 15px;

            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .bot .bubble {
            background: var(--bot-msg);
            border-top-left-radius: 5px;
        }

        .user .bubble {
            background: var(--user-msg);
            color: white;
            border-top-right-radius: 5px;
        }

        /* TYPING */

        .typing {
            display: none;
            align-items: center;
            gap: 5px;
        }

        .typing span {
            width: 7px;
            height: 7px;

            background: var(--secondary);

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        /* SUGGESTIONS */

        .suggestions {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px 10px;

            display: flex;
            gap: 8px;

            overflow-x: auto;
        }

        .suggestion {
            white-space: nowrap;

            padding: 9px 13px;

            border-radius: 20px;

            border: 1px solid var(--border);
            background: var(--chat-bg);

            color: var(--text);

            cursor: pointer;

            font-size: 13px;

            transition: 0.2s;
        }

        .suggestion:hover {
            background: var(--bot-msg);
        }

        /* INPUT */

        .input-area {
            background: var(--header);
            border-top: 1px solid var(--border);

            padding: 15px;
        }

        .input-box {
            max-width: 900px;
            margin: auto;

            display: flex;
            align-items: center;

            gap: 10px;

            background: var(--input-bg);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 8px 8px 8px 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }

        #messageInput {
            flex: 1;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            resize: none;

            max-height: 120px;
        }

        #messageInput::placeholder {
            color: var(--secondary);
        }

        .send-button {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 11px;

            background: var(--primary);

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        .send-button:hover {
            background: var(--primary-hover);
            transform: scale(1.03);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-text {
            max-width: 900px;
            margin: 8px auto 0;

            text-align: center;

            color: var(--secondary);

            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                padding: 0 15px;
                height: 62px;
            }

            .logo {
                width: 37px;
                height: 37px;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .chat-container {
                padding: 18px 10px;
            }

            .message-content {
                max-width: 82%;
            }

            .bubble {
                font-size: 14px;
            }

            .avatar {
                width: 34px;
                height: 34px;
            }

            .suggestions {
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        /* SCROLLBAR */

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        body.dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                AI
            </div>

            <div class="brand-text">
                <h1>My AI Chatbot</h1>
                <p>Online • Ready to help</p>
            </div>

        </div>

        <div class="header-buttons">

            <button
                class="icon-button"
                id="themeButton"
                title="Change theme">
                🌙
            </button>

            <button
                class="icon-button"
                id="clearButton"
                title="Clear chat">
                🗑️
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main class="chat-container" id="chatContainer">

        <div class="chat" id="chat">

            <!-- Initial bot message -->

            <div class="message bot">

                <div class="avatar">
                    AI
                </div>

                <div class="message-content">

                    <div class="message-name">
                        AI Assistant
                    </div>

                    <div class="bubble">
                        Hello! 👋

                        I'm your AI assistant.

                        You can ask me questions, request ideas, or just have a conversation with me.
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- QUICK QUESTIONS -->

    <div class="suggestions">

        <button class="suggestion">
            What can you do?
        </button>

        <button class="suggestion">
            Tell me a joke
        </button>

        <button class="suggestion">
            Give me an idea
        </button>

        <button class="suggestion">
            Help me learn coding
        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message AI Assistant..."
                autocomplete="off"></textarea>

            <button
                class="send-button"
                id="sendButton"
                title="Send message">

                ➤

            </button>

        </div>

        <div class="footer-text">
            AI responses are generated by this website's JavaScript.
        </div>

    </div>

</div>


<script>

    /* ==============================
       ELEMENTS
    ============================== */

    const chat = document.getElementById("chat");

    const chatContainer =
        document.getElementById("chatContainer");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const clearButton =
        document.getElementById("clearButton");

    const themeButton =
        document.getElementById("themeButton");

    const suggestions =
        document.querySelectorAll(".suggestion");


    /* ==============================
       CHAT STORAGE
    ============================== */

    const STORAGE_KEY = "my_ai_chat_history";

    let messages =
        JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];


    /* ==============================
       SAVE CHAT
    ============================== */

    function saveChat() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(messages)
        );

    }


    /* ==============================
       ADD MESSAGE
    ============================== */

    function addMessage(text, sender, save = true) {

        const message = document.createElement("div");

        message.className =
            "message " + sender;


        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            sender === "user" ? "U" : "AI";


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const name =
            document.createElement("div");

        name.className =
            "message-name";

        name.textContent =
            sender === "user"
                ? "You"
                : "AI Assistant";


        const bubble =
            document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;


        content.appendChild(name);

        content.appendChild(bubble);

        message.appendChild(avatar);

        message.appendChild(content);

        chat.appendChild(message);


        scrollToBottom();


        if (save) {

            messages.push({
                text: text,
                sender: sender
            });

            saveChat();

        }

    }


    /* ==============================
       LOAD CHAT
    ============================== */

    function loadChat() {

        if (messages.length === 0) {
            return;
        }

        chat.innerHTML = "";

        messages.forEach(message => {

            addMessage(
                message.text,
                message.sender,
                false
            );

        });

    }


    /* ==============================
       SCROLL
    ============================== */

    function scrollToBottom() {

        setTimeout(() => {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;

        }, 50);

    }


    /* ==============================
       TYPING INDICATOR
    ============================== */

    function showTyping() {

        const message =
            document.createElement("div");

        message.className =
            "message bot";

        message.id = "typingMessage";


        message.innerHTML = `

            <div class="avatar">
                AI
            </div>

            <div class="message-content">

                <div class="message-name">
                    AI Assistant
                </div>

                <div class="bubble">

                    <div class="typing"
                         style="display:flex">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>

        `;

        chat.appendChild(message);

        scrollToBottom();

    }


    /* ==============================
       REMOVE TYPING
    ============================== */

    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {
            typing.remove();
        }

    }


    /* ==============================
       BOT RESPONSE
    ============================== */

    function getBotResponse(input) {

        const text =
            input.toLowerCase().trim();


        if (
            text.includes("hello") ||
            text.includes("hi") ||
            text.includes("hey")
        ) {

            return "Hello! 👋 How can I help you today?";

        }


        if (
            text.includes("what can you do") ||
            text.includes("help")
        ) {

            return `I can help with many things!

• Answer simple questions
• Explain programming concepts
• Generate ideas
• Help with studying
• Tell jokes
• Have a conversation

You can also connect this website to an AI API later.`;

        }


        if (
            text.includes("joke")
        ) {

            return "Why do programmers prefer dark mode? Because light attracts bugs! 🐛😄";

        }


        if (
            text.includes("coding") ||
            text.includes("programming")
        ) {

            return "Absolutely! 💻 Tell me which language you're learning, such as HTML, CSS, JavaScript, Python, Java, or C++.";

        }


        if (
            text.includes("html")
        ) {

            return "HTML creates the structure of a website. CSS controls its appearance, and JavaScript adds interactivity.";

        }


        if (
            text.includes("css")
        ) {

            return "CSS is used to style websites. You can use it for colors, layouts, animations, responsive designs, and much more.";

        }


        if (
            text.includes("javascript") ||
            text.includes("js")
        ) {

            return "JavaScript makes websites interactive. For example, this chatbot uses JavaScript to receive messages and generate responses.";

        }


        if (
            text.includes("github")
        ) {

            return "GitHub is a platform for hosting and managing code. GitHub Pages can host static HTML, CSS, and JavaScript websites.";

        }


        if (
            text.includes("idea")
        ) {

            return "Here's an idea: build a personal AI study assistant with notes, quizzes, a timetable, and a progress tracker. 🚀";

        }


        if (
            text.includes("thank")
        ) {

            return "You're welcome! 😊";

        }


        if (
            text.includes("who are you")
        ) {

            return "I'm your website's AI assistant. 🤖";

        }


        const responses = [

            "That's interesting! Tell me more about it.",

            "I understand. What would you like to know next?",

            "Thanks for your message! How can I help you with that?",

            "I'm here to help. Could you give me a little more detail?",

            "Good question! You can ask me something about coding, websites, or general topics."

        ];


        return responses[
            Math.floor(
                Math.random() * responses.length
            )
        ];

    }


    /* ==============================
       SEND MESSAGE
    ============================== */

    function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        addMessage(text, "user");


        messageInput.value = "";

        messageInput.style.height = "auto";

        sendButton.disabled = true;


        showTyping();


        setTimeout(() => {

            removeTyping();

            const response =
                getBotResponse(text);

            addMessage(
                response,
                "bot"
            );

            sendButton.disabled = false;

        }, 700);

    }


    /* ==============================
       SEND BUTTON
    ============================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* ==============================
       ENTER KEY
    ============================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ==============================
       AUTO RESIZE TEXTAREA
    ============================== */

    messageInput.addEventListener(
        "input",
        function() {

            this.style.height = "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    120
                ) + "px";

        }
    );


    /* ==============================
       QUICK SUGGESTIONS
    ============================== */

    suggestions.forEach(button => {

        button.addEventListener(
            "click",
            function() {

                messageInput.value =
                    this.textContent;

                sendMessage();

            }
        );

    });


    /* ==============================
       CLEAR CHAT
    ============================== */

    clearButton.addEventListener(
        "click",
        function() {

            const confirmed =
                confirm(
                    "Clear the entire conversation?"
                );


            if (!confirmed) {
                return;
            }


            messages = [];

            localStorage.removeItem(
                STORAGE_KEY
            );


            chat.innerHTML = "";


            addMessage(
                "Hello! 👋 I'm your AI assistant. How can I help you?",
                "bot"
            );

        }
    );


    /* ==============================
       DARK MODE
    ============================== */

    const savedTheme =
        localStorage.getItem(
            "chatbot_theme"
        );


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        themeButton.textContent = "☀️";

    }


    themeButton.addEventListener(
        "click",
        function() {

            document.body.classList.toggle(
                "dark"
            );


            const dark =
                document.body.classList.contains(
                    "dark"
                );


            localStorage.setItem(
                "chatbot_theme",
                dark ? "dark" : "light"
            );


            themeButton.textContent =
                dark ? "☀️" : "🌙";

        }
    );


    /* ==============================
       INITIALIZE
    ============================== */

    loadChat();

</script>

</body>
</html>
```
