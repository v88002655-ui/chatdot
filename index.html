<body>

<div class="chat-container">

    <div class="header">
        <div>
            <h2>🤖 My AI Assistant</h2>
            <p>AI Chatbot + Smart Calculator</p>
        </div>
        <button class="clear-btn" id="clear-btn">Clear Chat</button>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot">
            नमस्ते! 👋 मैं तुम्हारा AI Assistant हूँ।

            मैं जोड़, घटाना, गुणा और भाग कर सकता हूँ।

            उदाहरण:
            25 + 15
            100 - 45
            12 × 8
            100 ÷ 4

            अपना सवाल लिखो!
        </div>
    </div>

    <div class="quick-actions">
        <button data-question="25 + 15">➕ जोड़</button>
        <button data-question="100 - 45">➖ घटाना</button>
        <button data-question="12 × 8">✖️ गुणा</button>
        <button data-question="100 ÷ 4">➗ भाग</button>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="अपना सवाल लिखें..."
            autocomplete="off"
        >
        <button id="send-btn">Send ➤</button>
    </div>

    <div class="status" id="status">
        Calculator चालू है | AI API वैकल्पिक है
    </div>

</div>

<script>
/*
=====================================================
1. GROQ API CONFIGURATION
=====================================================

अगर सामान्य सवालों के AI जवाब भी चाहिए, तो नीचे
अपनी Groq API key डालें।

ध्यान दें:
GitHub Pages पर रखी API key सार्वजनिक हो सकती है।
इसलिए इस फाइल में असली API key डालकर वेबसाइट
को सार्वजनिक रूप से प्रकाशित न करें।

सुरक्षित विकल्प: API key को server-side रखें।
*/

const GROQ_API_KEY = "";
const GROQ_MODEL = "llama-3.3-70b-versatile";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const statusBox = document.getElementById("status");

let busy = false;

/*
=====================================================
2. MESSAGE DISPLAY
=====================================================
*/

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;

    // यूज़र के टेक्स्ट को HTML की तरह नहीं चलाते।
    message.textContent = text;

    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

/*
=====================================================
3. SAFE MATH PARSER
=====================================================

यह parser केवल गणित के स्वीकार्य चिन्हों को हल करता है।
यह user input को JavaScript code की तरह execute नहीं करता।
*/

function tokenize(expression) {
    const tokens = [];
    let i = 0;

    while (i < expression.length) {
        const char = expression[i];

        if (/\s/.test(char)) {
            i++;
            continue;
        }

        // संख्याएँ, जैसे 25, 3.14
        if (/[0-9.]/.test(char)) {
            let number = "";
            let dots = 0;

            while (
                i < expression.length &&
                /[0-9.]/.test(expression[i])
            ) {
                if (expression[i] === ".") dots++;
                number += expression[i];
                i++;
            }

            if (dots > 1 || number === ".") {
                throw new Error("संख्या सही नहीं है।");
            }

            tokens.push(Number(number));
            continue;
        }

        if ("+-*/()%".includes(char)) {
            tokens.push(char);
            i++;
            continue;
        }

        throw new Error("सवाल में कोई गलत चिन्ह है।");
    }

    return tokens;
}

function evaluateMath(expression) {
    const tokens = tokenize(expression);
    let position = 0;

    function parseExpression() {
        let value = parseTerm();

        while (
            tokens[position] === "+" ||
            tokens[position] === "-"
        ) {
            const operator = tokens[position++];

            // अगले operator से पहले का term हल करें।
            const right = parseTerm();

            value = operator === "+"
                ? value + right
                : value - right;
        }

        return value;
    }

    function parseTerm() {
        let value = parseUnary();

        while (
            tokens[position] === "*" ||
            tokens[position] === "/" ||
            tokens[position] === "%"
        ) {
            const operator = tokens[position++];
            const right = parseUnary();

            if (
                (operator === "/" || operator === "%") &&
                right === 0
            ) {
                throw new Error("शून्य से भाग नहीं दे सकते!");
            }

            if (operator === "*") value *= right;
            if (operator === "/") value /= right;
            if (operator === "%") value %= right;
        }

        return value;
    }

    function parseUnary() {
        if (tokens[position] === "+") {
            position++;
            return parseUnary();
        }

        if (tokens[position] === "-") {
            position++;
            return -parseUnary();
        }

        return parsePrimary();
    }

    function parsePrimary() {
        const token = tokens[position++];

        if (typeof token === "number") {
            return token;
        }

        if (token === "(") {
            const value = parseExpression();

            if (tokens[position] !== ")") {
                throw new Error("ब्रैकेट बंद करना भूल गए।");
            }

            position++;
            return value;
        }

        throw new Error("गणित का सवाल समझ नहीं आया।");
    }

    if (tokens.length === 0) {
        throw new Error("पहले गणित का सवाल लिखो।");
    }

    const result = parseExpression();

    if (position !== tokens.length) {
        throw new Error("सवाल का format सही नहीं है।");
    }

    if (!Number.isFinite(result)) {
        throw new Error("इस सवाल का सीमित संख्यात्मक उत्तर नहीं है।");
    }

    return Number(result.toPrecision(12));
}

/*
=====================================================
4. HINDI / ENGLISH MATH QUESTION HANDLER
=====================================================
*/

function normalizeMathQuestion(question) {
    let q = question.toLowerCase().trim();

    // केवल सामान्य गणित के निर्देश हटाएँ।
    q = q
        .replace(/कितना होगा|कितना है|का उत्तर|उत्तर बताओ|हल करो|हल करें|निकालो|गणना करो|calculate|solve|what is|answer|please/g, " ")
        .replace(/जोड़(?:ो|ना)?|जमा करो|add|plus/g, "+")
        .replace(/घटाओ|घटाना|subtract|minus/g, "-")
        .replace(/गुणा करो|गुणा|multiply|multiplied by|times/g, "*")
        .replace(/भाग करो|भाग|divide|divided by/g, "/")
        .replace(/×|✕|✖/g, "*")
        .replace(/÷|\/|∕/g, "/")
        .replace(/[०-९]/g, digit =>
            "०१२३४५६७८९".indexOf(digit)
        )
        .replace(/,/g, " ")
        .trim();

    return q;
}

function getMathAnswer(question) {
    const expression = normalizeMathQuestion(question);

    // कम-से-कम एक गणित का operator होना चाहिए।
    if (!/[+\-*/%()]/.test(expression)) {
        return null;
    }

    // सामान्य वाक्यों को गणित समझकर हल करने से बचें।
    if (!/^[\d\s.+\-*/()%]+$/.test(expression)) {
        return null;
    }

    try {
        return evaluateMath(expression);
    } catch (error) {
        return {
            error: error.message
        };
    }
}

/*
=====================================================
5. OPTIONAL GROQ AI
=====================================================
*/

async function askGroq(question) {
    if (!GROQ_API_KEY.trim()) {
        return "यह गणित का सवाल नहीं लग रहा है। सामान्य AI जवाबों के लिए सुरक्षित backend और Groq API configuration जोड़नी होगी।";
    }

    const response = await fetch(
        "https://api.groq.com/openai/v1/chat/completions",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + GROQ_API_KEY
            },
            body: JSON.stringify({
                model: GROQ_MODEL,
                messages: [
                    {
                        role: "system",
                        content: "You are a helpful AI assistant. Answer clearly and simply. For arithmetic, calculate carefully."
                    },
                    {
                        role: "user",
                        content: question
                    }
                ],
                temperature: 0.2
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error?.message || "AI API request failed."
        );
    }

    return data.choices?.[0]?.message?.content
        || "माफ़ करना, कोई जवाब नहीं मिला।";
}

/*
=====================================================
6. SEND MESSAGE
=====================================================
*/

async function sendMessage() {
    if (busy) return;

    const question = userInput.value.trim();

    if (!question) return;

    addMessage(question, "user");
    userInput.value = "";

    // गणित का सवाल पहले calculator को भेजें।
    const mathAnswer = getMathAnswer(question);

    if (mathAnswer !== null) {
        if (
            typeof mathAnswer === "object" &&
            mathAnswer.error
        ) {
            addMessage("❌ " + mathAnswer.error, "bot");
        } else {
            addMessage("🧮 उत्तर: " + mathAnswer, "bot");
        }

        statusBox.textContent = "Calculator ने जवाब दिया।";
        return;
    }

    // सामान्य सवालों के लिए AI API।
    busy = true;
    sendBtn.disabled = true;
    statusBox.textContent = "AI जवाब तैयार कर रहा है...";

    try {
        const answer = await askGroq(question);
        addMessage(answer, "bot");
        statusBox.textContent = "तैयार";
    } catch (error) {
        addMessage("❌ AI Error: " + error.message, "bot");
        statusBox.textContent = "AI API में समस्या आई।";
    } finally {
        busy = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
}

/*
=====================================================
7. BUTTONS AND ENTER KEY
=====================================================
*/

sendBtn.addEventListener("click", sendMessage);

userInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        sendMessage();
    }
});

document.querySelectorAll("[data-question]").forEach(button => {
    button.addEventListener("click", () => {
        userInput.value = button.dataset.question;
        sendMessage();
    });
});

document.getElementById("clear-btn").addEventListener("click", () => {
    chatBox.replaceChildren();

    addMessage(
        "चैट साफ़ हो गई है! 😊 अपना अगला सवाल लिखो।",
        "bot"
    );

    statusBox.textContent = "Calculator चालू है";
});
</script>

</body>
</html>
